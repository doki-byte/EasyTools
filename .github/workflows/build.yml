name: Build EasyTools

on:
  push:
    tags: ['v*'] # 只在推送标签时触发
  workflow_dispatch: # 允许手动触发

# 添加权限设置
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux amd64：ubuntu-22.04 自带 webkit2gtk-4.0 官方包，构建最稳
          - os: ubuntu-22.04
            platform: linux/amd64
            display-name: linux-amd64
            output-dir: linux_amd64
          # Windows amd64
          - os: windows-latest
            platform: windows/amd64
            display-name: windows-amd64
            output-dir: windows_amd64
          # macOS Intel（macos-13 为 x64 runner）
          - os: macos-13
            platform: darwin/amd64
            display-name: darwin-amd64
            output-dir: darwin_amd64
          # macOS Apple Silicon（macos-14 为 arm64 runner）
          - os: macos-14
            platform: darwin/arm64
            display-name: darwin-arm64
            output-dir: darwin_arm64

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'

    # 缓存 Go 模块和构建缓存
    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    # 缓存 npm 依赖
    - name: Cache npm
      uses: actions/cache@v4
      with:
        path: ~/.npm
        key: ${{ runner.os }}-node-${{ hashFiles('frontend/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-

    - name: Install frontend dependencies
      run: npm ci
      working-directory: ./frontend

    - name: Install Wails CLI
      run: |
        go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.2

    # ============ 免杀模块可靠性门禁 ============
    # 端到端特征断言 + PE 图标原生替换测试（纯 Go，全平台可跑，确保 mac/linux 上免杀链路不依赖 Windows exe 工具）
    - name: Bypass module tests (gen & PE icon, all platforms)
      shell: bash
      run: |
        go test ./app/bypass/shell/util/ -run 'TestLoaderRegistryUniform|TestGenLoaderEndToEnd|TestPresetIconPNG|TestApplyPEIcon|TestReplacePEIconFile|TestResolveIconBytes|TestBuiltinIconLibrary|TestBuiltinIconApply' -count=1 -v
        # Unix 模板交叉编译校验（在 mac/linux 生成 Linux/macOS 目标产物）
        go test ./app/bypass/shell/util/ -run 'TestUnixLoaderCrossCompile' -count=1

    # Windows 特有：编译并实跑全部 45 个 Windows loader 模板（约 2 分钟）
    - name: Bypass runtime smoke (Windows only)
      if: matrix.os == 'windows-latest'
      shell: bash
      run: |
        go test ./app/bypass/shell/util/ -run 'TestGenLoaderRuntime' -count=1

    - name: Install Linux dependencies (Ubuntu 22.04)
      if: matrix.os == 'ubuntu-22.04'
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libayatana-appindicator3-dev librsvg2-dev build-essential
        echo "PKG_CONFIG_PATH=/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig" >> $GITHUB_ENV

    - name: Build application
      shell: bash
      run: |
        echo "Building for platform: ${{ matrix.platform }}"
        if [ "${{ matrix.os }}" == "ubuntu-22.04" ]; then
          export CGO_ENABLED=1
          export PKG_CONFIG_PATH=/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig
        fi
        wails build --clean --platform ${{ matrix.platform }} --trimpath -ldflags="-w -s"

    - name: Organize build output
      shell: bash
      run: |
        mkdir -p build/bin/${{ matrix.output-dir }}
        if [ "${{ matrix.os }}" == "macos-13" ] || [ "${{ matrix.os }}" == "macos-14" ]; then
          mv build/bin/EasyTools.app build/bin/${{ matrix.output-dir }}/
        elif [ "${{ matrix.os }}" == "windows-latest" ]; then
          mv build/bin/EasyTools.exe build/bin/${{ matrix.output-dir }}/
        else
          mv build/bin/EasyTools build/bin/${{ matrix.output-dir }}/
        fi

    - name: Install UPX (Linux)
      if: matrix.os == 'ubuntu-22.04'
      run: |
        sudo apt-get update
        sudo apt-get install -y upx

    # 使用 Chocolatey 安装 UPX（Windows）
    - name: Install UPX (Windows)
      if: matrix.os == 'windows-latest'
      shell: bash
      run: |
        choco install upx -y

    - name: Install create-dmg (macOS)
      if: matrix.os == 'macos-13' || matrix.os == 'macos-14'
      run: brew install create-dmg

    - name: Compress with UPX (Linux)
      if: matrix.os == 'ubuntu-22.04'
      run: |
        upx ./build/bin/${{ matrix.output-dir }}/EasyTools

    - name: Compress with UPX (Windows)
      if: matrix.os == 'windows-latest'
      shell: bash
      run: |
        upx ./build/bin/${{ matrix.output-dir }}/EasyTools.exe

    - name: Package macOS app to DMG (for macOS builds)
      if: matrix.os == 'macos-13' || matrix.os == 'macos-14'
      shell: bash
      run: |
        cd build/bin/${{ matrix.output-dir }}
        create-dmg \
          --volname "EasyTools" \
          --window-pos 200 120 \
          --window-size 800 400 \
          --icon-size 100 \
          --icon "EasyTools.app" 200 190 \
          --app-drop-link 600 185 \
          --hide-extension "EasyTools.app" \
          --volicon "EasyTools.app/Contents/Resources/iconfile.icns" \
          "EasyTools-${{ matrix.display-name }}.dmg" \
          .
        cd ../../..

    - name: Package Linux binary (for Linux builds)
      if: matrix.os == 'ubuntu-22.04'
      shell: bash
      run: |
        cd build/bin/${{ matrix.output-dir }}
        tar -czf EasyTools-${{ matrix.display-name }}.tar.gz EasyTools
        cd ../../..

    - name: Package Windows binary (for Windows builds)
      if: matrix.os == 'windows-latest'
      shell: bash
      run: |
        cd build/bin/${{ matrix.output-dir }}
        7z a EasyTools-${{ matrix.display-name }}.zip EasyTools.exe
        cd ../../..

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: EasyTools-${{ matrix.display-name }}
        path: |
          build/bin/${{ matrix.output-dir }}/*

  # 更新 Release 的作业
  update-release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: List downloaded artifacts
        run: |
          find ./artifacts -type f | sort
          echo "--- Directory structure ---"
          find ./artifacts -type d | sort

      - name: Prepare release files
        shell: bash
        run: |
          mkdir -p release-files
          for artifact_dir in ./artifacts/*; do
            if [ -d "$artifact_dir" ]; then
              platform_name=$(basename "$artifact_dir")
              echo "Processing $platform_name"
              package_file=$(find "$artifact_dir" -name "*.zip" -o -name "*.tar.gz" -o -name "*.dmg" | head -n 1)
              if [ -n "$package_file" ]; then
                cp "$package_file" "./release-files/$(basename "$package_file")"
                echo "Using packaged file: $package_file"
              else
                cp -r "$artifact_dir" "./release-files/$platform_name"
                echo "Using directory: $artifact_dir"
              fi
            fi
          done
          echo "--- Final release files ---"
          ls -la release-files/

      - name: Update Release with binaries
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            Automated release for ${{ github.ref_name }}
          artifacts: "release-files/**/*"
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
